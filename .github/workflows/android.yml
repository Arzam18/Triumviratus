
name: Build Triumviratus for Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    paths:
      - "source/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK r27c
        shell: bash
        run: |
          set -euxo pipefail

          NDK_ROOT="$HOME/android-ndk-r27c"
          NDK_ZIP="$RUNNER_TEMP/android-ndk-r27c-linux.zip"

          curl -L --fail --retry 5 \
            -o "$NDK_ZIP" \
            "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"

          rm -rf "$NDK_ROOT"
          unzip -q "$NDK_ZIP" -d "$HOME"

          test -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

          echo "NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Obtain Triumviratus NNUE network
        shell: bash
        run: |
          set -euxo pipefail

          NETWORK_REPO="https://github.com/Tors3/Triumviratus-Networks.git"
          NETWORK_DIR="$RUNNER_TEMP/Triumviratus-Networks"
          NET_NAME="nn-consilium.nnue"
          NET_PATH="nets/$NET_NAME"

          export GIT_LFS_SKIP_SMUDGE=1

          git clone --depth 1 "$NETWORK_REPO" "$NETWORK_DIR"
          cd "$NETWORK_DIR"

          git lfs install

          if ! git ls-tree -r --name-only HEAD | grep -Fx "$NET_PATH" >/dev/null; then
            echo "ERROR: $NET_PATH was not found in the network repository."
            exit 1
          fi

          git lfs pull --include="$NET_PATH" --exclude=""

          test -f "$NET_PATH"
          test "$(stat -c%s "$NET_PATH")" -ge 1000000

          cp "$NET_PATH" "$GITHUB_WORKSPACE/source/$NET_NAME"
          ls -lh "$GITHUB_WORKSPACE/source/$NET_NAME"

      # FIX: resolve the uint64_t vs unsigned long long pointer mismatch.
      - name: Patch ARM64 board pointer types
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          FILE="consilium_bridge.cpp"
          test -f "$FILE"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("consilium_bridge.cpp")
          source = path.read_text()

          old = "return cn::Board{piece_bb_, occupied_, mb_, mover_ == BLACK};"
          new = (
              "return cn::Board{"
              "reinterpret_cast<const std::uint64_t*>(piece_bb_), "
              "reinterpret_cast<const std::uint64_t*>(occupied_), "
              "mb_, mover_ == BLACK};"
          )

          count = source.count(old)
          if count != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one board initializer, found {count}. "
                  "Source may have changed; refusing an unsafe patch."
              )

          source = source.replace(old, new, 1)
          path.write_text(source)

          print("Applied ARM64 board pointer compatibility patch.")
          PY

          grep -n "cn::Board view" "$FILE"

      - name: Verify NNUE network
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          NET="nn-consilium.nnue"
          test -f "$NET"

          SIZE=$(stat -c%s "$NET")
          echo "NNUE size: $SIZE bytes"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: NNUE file is suspiciously small."
            exit 1
          fi

          file "$NET"
          ls -lh "$NET"

      - name: Build Triumviratus ARM64 NEON
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          make clean

          make android \
            NDK="$NDK_ROOT" \
            NET_NAME=nn-consilium.nnue \
            EXE=Triumviratus-android-arm64-neon

      - name: Verify Android ARM64 binary
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          BIN="Triumviratus-android-arm64-neon"
          LLVM="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -f "$BIN"
          test -x "$BIN"

          "$LLVM/llvm-readelf" -h "$BIN"
          "$LLVM/llvm-readelf" -A "$BIN" || true

          file "$BIN"
          ls -lh "$BIN"

      - name: Verify NNUE embedding
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          BIN="Triumviratus-android-arm64-neon"
          SIZE=$(stat -c%s "$BIN")

          echo "Final binary size: $SIZE bytes"

          if [ "$SIZE" -lt 90000000 ]; then
            echo "ERROR: Binary is too small; NNUE embedding may have failed."
            exit 1
          fi

          echo "NNUE embedding verification passed."

      - name: Prepare artifact
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../artifact
          cp Triumviratus-android-arm64-neon ../artifact/

      - name: Upload Android engine
        uses: actions/upload-artifact@v4
        with:
          name: Triumviratus-android-arm64-neon
          path: artifact/Triumviratus-android-arm64-neon
          if-no-files-found: error
