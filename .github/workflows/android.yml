
name: Build Triumviratus for Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    paths:
      - "source/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      # ========================================
      # CHECKOUT
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # INSTALL ANDROID NDK r27c
      # ========================================
      - name: Install Android NDK r27c
        shell: bash
        run: |
          set -euxo pipefail

          NDK_ROOT="$HOME/android-ndk-r27c"
          NDK_ZIP="$RUNNER_TEMP/android-ndk-r27c-linux.zip"

          curl -fL --retry 5 --retry-all-errors \
            -o "$NDK_ZIP" \
            "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"

          rm -rf "$NDK_ROOT"

          unzip -q "$NDK_ZIP" -d "$HOME"

          test -x \
            "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

          echo "NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"

          echo "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            >> "$GITHUB_PATH"

      # ========================================
      # VERIFY UPSTREAM POINTER FIX
      # No source modifications necessary.
      # ========================================
      - name: Verify upstream source
        shell: bash
        run: |
          set -euxo pipefail

          FILE="source/consilium_bridge.cpp"

          grep -Fq \
            'reinterpret_cast<const std::uint64_t*>(piece_bb_)' \
            "$FILE"

          grep -Fq \
            'reinterpret_cast<const std::uint64_t*>(occupied_)' \
            "$FILE"

          echo "Upstream ARM64 pointer compatibility fix confirmed."

      # ========================================
      # DOWNLOAD OFFICIAL 8.1 NNUE
      # ========================================
      - name: Download official Consilium Plebis network
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          NET="nn-consilium-plebis.nnue"

          URL="https://github.com/Tors3/Triumviratus-Networks/releases/download/consilium-plebis/nn-consilium-plebis.nnue"

          SHA256="b069fc089421bdf2dfcc5d7ea4de2345d7af4795cd996373c07d5f5cf67e0670"

          rm -f "$NET"

          curl -fL --retry 5 --retry-all-errors \
            "$URL" \
            -o "$NET"

          echo "$SHA256  $NET" | sha256sum -c -

          test -s "$NET"

          echo "Official network successfully verified:"
          ls -lh "$NET"

      # ========================================
      # BUILD ARM64 NEON
      # ========================================
      - name: Build Triumviratus ARM64 NEON
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          NET="nn-consilium-plebis.nnue"

          test -f "$NET"

          make clean

          make android \
            NDK="$NDK_ROOT" \
            NET_NAME="$NET" \
            EXE=Triumviratus-android-arm64-neon

      # ========================================
      # VERIFY ANDROID BINARY
      # ========================================
      - name: Verify Android ARM64 binary
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          BIN="Triumviratus-android-arm64-neon"

          LLVM="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -f "$BIN"
          test -x "$BIN"

          "$LLVM/llvm-readelf" -h "$BIN"

          "$LLVM/llvm-readelf" -A "$BIN" || true

          file "$BIN"

          ls -lh "$BIN"

      # ========================================
      # VERIFY NNUE EMBEDDING
      # ========================================
      - name: Verify embedded NNUE
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          BIN="Triumviratus-android-arm64-neon"
          NET="nn-consilium-plebis.nnue"

          BIN_SIZE=$(stat -c%s "$BIN")
          NET_SIZE=$(stat -c%s "$NET")

          echo "Network size: $NET_SIZE bytes"
          echo "Binary size: $BIN_SIZE bytes"

          if [ "$BIN_SIZE" -le "$NET_SIZE" ]; then
            echo "::error::Embedded NNUE verification failed."
            exit 1
          fi

          echo "NNUE embedding verification passed."

      # ========================================
      # PREPARE ARTIFACT
      # ========================================
      - name: Prepare artifact
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../artifact

          cp \
            Triumviratus-android-arm64-neon \
            ../artifact/

      # ========================================
      # UPLOAD
      # ========================================
      - name: Upload Android engine
        uses: actions/upload-artifact@v4
        with:
          name: Triumviratus-android-arm64-neon
          path: artifact/Triumviratus-android-arm64-neon
          if-no-files-found: error
