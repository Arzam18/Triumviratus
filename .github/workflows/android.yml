
name: Build Triumviratus Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    paths:
      - "source/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK r27c
        shell: bash
        run: |
          set -euxo pipefail

          curl -fL --retry 5 \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip \
            -o "$RUNNER_TEMP/ndk.zip"

          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$HOME"

          echo "NDK_ROOT=$HOME/android-ndk-r27c" >> "$GITHUB_ENV"

      - name: Check repository and network references
        shell: bash
        run: |
          set -euxo pipefail

          echo "Repository files:"
          find . -maxdepth 4 -type f \
            \( -name 'Makefile' \
            -o -name '*.cpp' \
            -o -name '*.nnue' \) | sort

          echo "Network references:"
          grep -RInE \
            'nn-consilium(-plebis)?\.nnue|NET_NAME|incbin' \
            source \
            --include='*.cpp' \
            --include='*.h' \
            --include='Makefile' \
            || true

      - name: Verify required NNUE file
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          # The assembler error explicitly requires this filename.
          NET="nn-consilium-plebis.nnue"

          if [ ! -f "$NET" ]; then
            echo "::error::Missing $NET. The actual network file must be supplied; renaming a different network is not a valid fix."
            exit 1
          fi

          if [ "$(stat -c%s "$NET")" -lt 1000000 ]; then
            echo "::error::The network file is unexpectedly small."
            exit 1
          fi

          ls -lh "$NET"

      - name: Build Android ARM64 NEON
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          make clean

          make android \
            NDK="$NDK_ROOT" \
            NET_NAME=nn-consilium-plebis.nnue \
            EXE=Triumviratus-android-arm64-neon

      - name: Verify binary
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          BIN="Triumviratus-android-arm64-neon"
          LLVM="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$BIN"
          "$LLVM/llvm-readelf" -h "$BIN"
          file "$BIN"

          mkdir -p ../artifact
          cp "$BIN" ../artifact/

      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: Triumviratus-android-arm64-neon
          path: artifact/Triumviratus-android-arm64-neon
          if-no-files-found: error
