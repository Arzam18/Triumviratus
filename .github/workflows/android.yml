name: Build Triumviratus for Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    paths:
      - "source/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT TRIUMVIRATUS
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # INSTALL ANDROID NDK 27.2.12479018
      #
      # r27c extracts to:
      #   $HOME/android-ndk-r27c
      # ============================================================
      - name: Install Android NDK 27.2.12479018
        shell: bash
        run: |
          set -euxo pipefail

          NDK_ROOT="$HOME/android-ndk-r27c"
          NDK_ZIP="$RUNNER_TEMP/android-ndk-r27c-linux.zip"

          curl -L --fail --retry 5 \
            -o "$NDK_ZIP" \
            "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"

          rm -rf "$NDK_ROOT"

          unzip -q "$NDK_ZIP" -d "$HOME"

          test -x \
            "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

          echo "NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"

          echo "$NDK_ROOT" >> "$GITHUB_PATH"

          echo "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            >> "$GITHUB_PATH"

          echo "Android NDK installed:"
          echo "$NDK_ROOT"

      # ============================================================
      # OBTAIN THE OFFICIAL TRIUMVIRATUS NETWORK
      #
      # NETWORKS.md in this repository explicitly points to:
      #
      #   https://github.com/Tors3/Triumviratus-Networks
      #
      # The network repository uses Git LFS.
      #
      # We disable automatic LFS downloading during clone so that
      # we do NOT download every network in the repository.
      # ============================================================
      - name: Obtain Triumviratus NNUE network
        shell: bash
        run: |
          set -euxo pipefail

          NETWORK_REPO="https://github.com/Tors3/Triumviratus-Networks.git"
          NETWORK_DIR="$RUNNER_TEMP/Triumviratus-Networks"

          rm -rf "$NETWORK_DIR"

          export GIT_LFS_SKIP_SMUDGE=1

          git clone \
            --depth 1 \
            "$NETWORK_REPO" \
            "$NETWORK_DIR"

          cd "$NETWORK_DIR"

          git lfs install

          echo "Searching for nn-legio-septima.nnue..."

          NET_PATH=$(git ls-tree -r --name-only HEAD | \
            grep -E '(^|/)nn-legio-septima\.nnue$' | \
            head -n 1 || true)

          if [ -z "$NET_PATH" ]; then
            echo "ERROR: nn-legio-septima.nnue was not found in"
            echo "Tors3/Triumviratus-Networks."
            exit 1
          fi

          echo "Found network:"
          echo "$NET_PATH"

          git lfs pull \
            --include="$NET_PATH" \
            --exclude=""

          test -f "$NETWORK_DIR/$NET_PATH"

          echo "Network downloaded:"
          ls -lh "$NETWORK_DIR/$NET_PATH"

          mkdir -p "$GITHUB_WORKSPACE/source"

          cp \
            "$NETWORK_DIR/$NET_PATH" \
            "$GITHUB_WORKSPACE/source/nn-legio-septima.nnue"

          echo "Network copied to:"
          echo "$GITHUB_WORKSPACE/source/nn-legio-septima.nnue"

      # ============================================================
      # VERIFY NNUE BEFORE BUILD
      # ============================================================
      - name: Verify NNUE network
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          NET="nn-legio-septima.nnue"

          test -f "$NET"

          SIZE=$(stat -c%s "$NET")

          echo "NNUE size: $SIZE bytes"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: NNUE file is suspiciously small."
            exit 1
          fi

          file "$NET"
          ls -lh "$NET"

      # ============================================================
      # BUILD TRIUMVIRATUS ARM64 NEON
      #
      # Because nn-legio-septima.nnue now exists at the Makefile
      # build root, the existing Makefile will NOT define:
      #
      #   -DNNUE_EMBEDDING_OFF
      #
      # and INCBIN will embed the network.
      # ============================================================
      - name: Build Triumviratus ARM64 NEON
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          make clean

          make android \
            NDK="$NDK_ROOT" \
            EXE=Triumviratus-android-arm64-neon

      # ============================================================
      # VERIFY ANDROID ARM64 BINARY
      # ============================================================
      - name: Verify Android ARM64 binary
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          BIN="Triumviratus-android-arm64-neon"

          LLVM="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -f "$BIN"
          test -x "$BIN"

          "$LLVM/llvm-readelf" -h "$BIN"

          "$LLVM/llvm-readelf" -A "$BIN" || true

          file "$BIN"

          ls -lh "$BIN"

      # ============================================================
      # VERIFY NNUE WAS EMBEDDED
      #
      # Your previous networkless binary was about 684 KB.
      # The embedded-network binary must be vastly larger.
      # ============================================================
      - name: Verify embedded NNUE
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          BIN="Triumviratus-android-arm64-neon"

          SIZE=$(stat -c%s "$BIN")

          echo "Final binary size: $SIZE bytes"

          if [ "$SIZE" -lt 90000000 ]; then
            echo "ERROR: Binary is too small."
            echo "The NNUE network was probably not embedded."
            exit 1
          fi

          echo "NNUE embedding verification passed."

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================
      - name: Prepare artifact
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ../artifact

          cp \
            "Triumviratus-android-arm64-neon" \
            ../artifact/

      # ============================================================
      # UPLOAD ONLY ENGINE
      # ============================================================
      - name: Upload Android engine
        uses: actions/upload-artifact@v4
        with:
          name: Triumviratus-android-arm64-neon
          path: artifact/Triumviratus-android-arm64-neon
          if-no-files-found: error
