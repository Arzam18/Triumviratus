
name: Build Triumviratus Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    paths:
      - "source/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK r27c
        shell: bash
        run: |
          set -euxo pipefail

          curl -fL --retry 5 \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip \
            -o "$RUNNER_TEMP/ndk.zip"

          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$HOME"

          echo "NDK_ROOT=$HOME/android-ndk-r27c" >> "$GITHUB_ENV"

      - name: Download official Consilium Plebis network
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          NET="nn-consilium-plebis.nnue"
          URL="https://github.com/Tors3/Triumviratus-Networks/releases/download/consilium-plebis/nn-consilium-plebis.nnue"
          EXPECTED="b069fc089421bdf2dfcc5d7ea4de2345d7af4795cd996373c07d5f5cf67e0670"

          curl -fL --retry 5 "$URL" -o "$NET"

          echo "$EXPECTED  $NET" | sha256sum -c -

          test "$(stat -c%s "$NET")" -gt 200000000
          ls -lh "$NET"

      - name: Patch ARM64 pointer compatibility
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("consilium_bridge.cpp")
          text = path.read_text()

          old = "return cn::Board{piece_bb_, occupied_, mb_, mover_ == BLACK};"
          new = (
              "return cn::Board{"
              "reinterpret_cast<const std::uint64_t*>(piece_bb_), "
              "reinterpret_cast<const std::uint64_t*>(occupied_), "
              "mb_, mover_ == BLACK};"
          )

          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("Applied ARM64 pointer compatibility patch.")
          elif new in text:
              print("Pointer compatibility patch already applied.")
          else:
              raise SystemExit(
                  "ERROR: Board initializer changed; inspect source before patching."
              )
          PY

      - name: Build ARM64 NEON engine
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          test -f nn-consilium-plebis.nnue

          make clean

          make android \
            NDK="$NDK_ROOT" \
            NET_NAME=nn-consilium-plebis.nnue \
            EXE=Triumviratus-android-arm64-neon

      - name: Verify binary and embedded network
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail

          BIN="Triumviratus-android-arm64-neon"
          LLVM="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$BIN"

          file "$BIN"
          "$LLVM/llvm-readelf" -h "$BIN"

          # The binary should contain the embedded 255+ MB network.
          BIN_SIZE=$(stat -c%s "$BIN")
          echo "Binary size: $BIN_SIZE bytes"

          if [ "$BIN_SIZE" -lt 200000000 ]; then
            echo "::error::Binary is too small to confirm network embedding."
            exit 1
          fi

          mkdir -p ../artifact
          cp "$BIN" ../artifact/

      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: Triumviratus-android-arm64-neon
          path: artifact/Triumviratus-android-arm64-neon
          if-no-files-found: error
